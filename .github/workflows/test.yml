on: [ push ]

name: CI

jobs:
  build_and_test:
    name: Rust project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain
      - uses: Swatinem/rust-cache
      - uses: extractions/setup-just
      - run: cargo test --lib
      - run: cargo rustc --no-default-features -- -Awarnings
